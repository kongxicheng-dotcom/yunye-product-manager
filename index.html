<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云野家具 · 产品管理 V1.2</title><style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;background:#f5f6f8;color:#18212f;margin:0}header{background:#172b45;color:white;padding:24px max(20px,calc((100% - 1100px)/2))}main{max-width:1100px;margin:25px auto;padding:0 16px}.panel{background:white;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 14px #142b4510}h1{margin:0;font-size:24px}h2{font-size:19px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:13px;color:#526072;display:block}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px;font:inherit}button{background:#2358a4;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e9eef5;color:#25364d}button.danger{background:#a52828}.actions{margin-top:15px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{border:1px solid #e2e8f0;border-radius:12px;padding:14px}.card img{width:100%;height:170px;object-fit:contain;background:#f7f8fa;border-radius:8px}.muted{color:#657286;font-size:13px}.empty{text-align:center;padding:35px;color:#68788a}small{color:#718096}#status{color:#1b6b40}.preview{margin-top:12px;padding:12px;background:#f6f9fd;border:1px solid #d6e3f5;border-radius:10px}.preview table{width:100%;border-collapse:collapse}.preview td,.preview th{padding:7px;border-bottom:1px solid #dce6f1;text-align:left;font-size:13px}.preview th{color:#526072}button:disabled{opacity:.45;cursor:not-allowed} </style></head><body><header><h1>云野家具 · 产品管理系统</h1><div style="margin-top:6px;color:#c9d7ea">YUNYE Furniture | V1.2 · 图文联合导入</div></header><main><section class="panel" id="smartPaste"><h2>图文联合导入 · 自动归类规格 <span class="muted">V1.2</span></h2><p class="muted">粘贴产品参数，同时选择或粘贴产品白底图，系统把文字识别成字段并自动关联图片。检查识别结果，再填入下方产品表单并保存。全部在本地浏览器处理，不上传云端。</p><label for="specText">粘贴产品参数</label><textarea id="specText" rows="6" placeholder="PD00516&#10;总深66 座深48 坐高44&#10;总宽65 总高75&#10;毛重10.2kg 净重7.35kg"></textarea><div class="grid" style="margin-top:12px"><label>产品白底图（可直接 Ctrl+V 粘贴图片）<input id="smartImage" type="file" accept="image/*"></label><div><img id="smartImagePreview" alt="白底图预览" style="display:none;max-width:200px;max-height:145px;object-fit:contain;border:1px solid #d6e3f5;border-radius:8px"><p class="muted" id="smartImageMessage">尚未选择图片</p></div></div><div class="actions"><button id="parseSpecs" type="button">识别参数</button><button id="applySpecs" type="button" disabled>将识别结果填入表单</button><button id="exampleSpecs" type="button" class="secondary">试用示例</button><button id="clearSpecs" type="button" class="secondary">清空文字</button></div><div id="specMessage" class="muted" role="status" aria-live="polite"></div><div id="specPreview" class="preview" hidden></div><p class="muted">注意：仅根据文字归类参数；图片作为主图保存，不做图片尺寸识别。未提供的数据保持空白，不会猜测。若编辑已有产品，只覆盖本次识别的字段；尺寸默认 cm、重量 kg，明确标注 mm/g 时换算。</p></section><section class="panel"><h2 id="formTitle">新增产品</h2><form id="form"><div class="grid"><label>产品型号 *<input name="model" required placeholder="YY-C-1001"></label><label>产品名称 *<input name="name" required placeholder="休闲软包单椅"></label><label>产品分类<select name="category"><option>休闲椅</option><option>沙发</option><option>沙发床</option><option>摇椅</option><option>脚蹬</option><option>其他</option></select></label><label>客户 / 项目<input name="customer"></label><label>总宽 cm<input type="number" step="any" name="width"></label><label>总深 cm<input type="number" step="any" name="depth"></label><label>总高 cm<input type="number" step="any" name="height"></label><label>坐高 cm<input type="number" step="any" name="seatHeight"></label><label>座深 cm<input type="number" step="any" name="seatDepth"></label><label>面料<input name="fabric"></label><label>颜色<input name="color"></label><label>框架 / 底座<input name="frame"></label><label>包装长 cm<input type="number" step="any" name="packL"></label><label>包装宽 cm<input type="number" step="any" name="packW"></label><label>包装高 cm<input type="number" step="any" name="packH"></label><label>净重 kg<input type="number" step="any" name="netWeight"></label><label>毛重 kg<input type="number" step="any" name="grossWeight"></label><label>每箱数量<input type="number" name="perCarton"></label><label>成本价<input type="number" step="any" name="cost"></label><label>销售报价<input type="number" step="any" name="price"></label><label>币种<select name="currency"><option>CNY</option><option>USD</option></select></label><label>产品图片（本机上传）<input type="file" id="photo" accept="image/*"></label></div><p><label>备注<textarea name="notes" rows="2"></textarea></label></p><div class="actions"><button type="submit">保存产品</button><button type="button" class="secondary" id="reset">清空 / 取消编辑</button> <span id="status"></span></div></form></section><section class="panel"><h2>产品档案 <span id="count" class="muted"></span></h2><div class="grid"><input id="search" placeholder="搜索型号、名称、客户、面料"><select id="filter"><option value="">全部分类</option><option>休闲椅</option><option>沙发</option><option>沙发床</option><option>摇椅</option><option>脚蹬</option><option>其他</option></select></div><div class="actions"><button id="exportJson">备份 JSON</button><button id="exportCsv" class="secondary">导出 CSV</button><button id="importBtn" class="secondary">导入 JSON 备份</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><p class="muted">数据仅保存在当前浏览器中。请定期备份；公开网页不等于企业级安全存储。</p><div id="cards" class="cards"></div></section></main><script>
const KEY='yunye_products_v1';let products=[];let editing=null;let image='';const form=document.querySelector('#form');const fields=['model','name','category','customer','width','depth','height','seatHeight','seatDepth','fabric','color','frame','packL','packW','packH','netWeight','grossWeight','perCarton','cost','price','currency','notes'];function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');products=Array.isArray(x)?x:[]}catch{products=[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(products));return true}catch{alert('保存失败：浏览器空间可能不足。请导出备份或换用较小图片。');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clear(){form.reset();editing=null;image='';document.querySelector('#photo').value='';document.querySelector('#formTitle').textContent='新增产品';document.querySelector('#status').textContent=''}function render(){const q=document.querySelector('#search').value.toLowerCase(),cat=document.querySelector('#filter').value;const filtered=products.filter(p=>(!cat||p.category===cat)&&[p.model,p.name,p.customer,p.fabric].some(v=>String(v||'').toLowerCase().includes(q)));document.querySelector('#count').textContent=`（共 ${products.length} 款，显示 ${filtered.length} 款）`;document.querySelector('#cards').innerHTML=filtered.length?filtered.map(p=>`<article class="card">${p.image?`<img src="${p.image}" alt="产品图">`:'<div class="empty">暂无图片</div>'}<h3>${esc(p.model)} · ${esc(p.name)}</h3><div class="muted">${esc(p.category)} | ${esc(p.customer||'未填写客户')}</div><p>尺寸：${esc(p.width||'-')} × ${esc(p.depth||'-')} × ${esc(p.height||'-')} cm<br>面料：${esc(p.fabric||'-')} · ${esc(p.color||'-')}<br>报价：${esc(p.price||'-')} ${esc(p.currency||'CNY')}</p><button data-edit="${esc(p.id)}">编辑</button><button class="danger" data-delete="${esc(p.id)}">删除</button></article>`).join(''):'<div class="empty">暂无符合条件的产品。请先录入第一款。</div>'}form.addEventListener('submit',e=>{e.preventDefault();const p={};fields.forEach(k=>p[k]=form.elements[k].value.trim());p.id=editing||('p'+Date.now()+Math.random().toString(36).slice(2));p.image=image;const idx=products.findIndex(x=>x.id===p.id);if(idx>=0)products[idx]=p;else products.unshift(p);if(save()){clear();render();document.querySelector('#status').textContent='保存成功'}});document.querySelector('#photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('请选择小于5MB的图片');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);image=canvas.toDataURL('image/jpeg',.75)};img.src=reader.result};reader.readAsDataURL(f)});document.querySelector('#cards').addEventListener('click',e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;const p=products.find(x=>x.id===id);if(!p)return;if(e.target.dataset.delete){if(confirm(`确认删除 ${p.model}？`)){products=products.filter(x=>x.id!==id);save();render()}return}editing=id;image=p.image||'';fields.forEach(k=>form.elements[k].value=p[k]||'');document.querySelector('#formTitle').textContent='编辑产品：'+p.model;window.scrollTo({top:0,behavior:'smooth'})});document.querySelector('#reset').onclick=clear;document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelector('#exportJson').onclick=()=>download('云野产品备份.json',JSON.stringify(products,null,2),'application/json');document.querySelector('#exportCsv').onclick=()=>{const header=fields;const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('云野产品列表.csv','\ufeff'+[header.join(','),...products.map(p=>header.map(k=>quote(p[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};document.querySelector('#importBtn').onclick=()=>document.querySelector('#importFile').click();document.querySelector('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(p=>p&&typeof p==='object'&&typeof p.id==='string'&&typeof p.model==='string'))throw Error('格式不符合产品备份要求');if(!confirm(`导入 ${data.length} 款产品？将覆盖当前所有数据，请先备份。`))return;products=data;if(save()){clear();render()}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};load();render();
</script><script>
// V1.2: Offline parsing of pasted product data and attaching a user-supplied product photo.
(function(){
'use strict';
const $=id=>document.getElementById(id);
const labels={model:'产品型号',name:'产品名称',category:'产品分类',customer:'客户 / 项目',width:'总宽 cm',depth:'总深 cm',height:'总高 cm',seatHeight:'坐高 cm',seatDepth:'座深 cm',fabric:'面料',color:'颜色',frame:'框架 / 底座',packL:'包装长 cm',packW:'包装宽 cm',packH:'包装高 cm',netWeight:'净重 kg',grossWeight:'毛重 kg',perCarton:'每箱数量',cost:'成本价',price:'销售报价',currency:'币种',notes:'备注'};
const aliases={width:['总宽','整体宽度','overall width'],depth:['总深','整体深度','overall depth'],height:['总高','整体高度','overall height'],seatHeight:['坐高','座高','seat height'],seatDepth:['座深','坐深','seat depth'],netWeight:['净重','net weight'],grossWeight:['毛重','gross weight'],perCarton:['每箱数量','装箱数量','每箱','pcs/ctn'],cost:['成本价','产品成本'],price:['销售报价','销售价','报价'],packL:['包装长','纸箱长','外箱长'],packW:['包装宽','纸箱宽','外箱宽'],packH:['包装高','纸箱高','外箱高']};
const textual={model:['产品型号','型号','sku','model no','model'],name:['产品名称','品名','product name'],customer:['客户','项目','customer'],fabric:['面料','fabric','upholstery'],color:['颜色','色号','colour','color'],frame:['框架','底座','frame','base'],notes:['备注','remark','notes']};
const escaped=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let parsed={}, selectedPhoto='';
function extract(raw){
 const text=raw.replace(/：/g,':').replace(/[，；]/g,' ').replace(/[×✕＊]/g,'x').replace(/[（]/g,'(').replace(/[）]/g,')');const found={};
 // Labeled numbers can be on one line with other labels.
 for(const [key,names] of Object.entries(aliases)){
   for(const alias of names){
     const re=new RegExp('(?:^|[\\s,;|])'+escaped(alias).replace(/\\ /g,'\\s*')+'\\s*[:=]?\\s*([0-9]+(?:\\.[0-9]+)?)\\s*(mm|cm|kg|g)?','i');
     const m=text.match(re);if(!m)continue;
     let v=Number(m[1]);const unit=(m[2]||'').toLowerCase();
     if(['width','depth','height','seatHeight','seatDepth','packL','packW','packH'].includes(key)&&unit==='mm')v/=10;
     if(['netWeight','grossWeight'].includes(key)&&unit==='g')v/=1000;
     found[key]=String(Number(v.toFixed(4)));break;
   }
 }
 const patterns=[{rx:/(?:产品尺寸|整体尺寸|外形尺寸|overall\s*size)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*[x*]\s*(\d+(?:\.\d+)?)\s*[x*]\s*(\d+(?:\.\d+)?)\s*(mm|cm)?/i,keys:['width','depth','height']},{rx:/(?:包装尺寸|纸箱尺寸|外箱尺寸|carton\s*size)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*[x*]\s*(\d+(?:\.\d+)?)\s*[x*]\s*(\d+(?:\.\d+)?)\s*(mm|cm)?/i,keys:['packL','packW','packH']}];
 for(const p of patterns){const m=text.match(p.rx);if(!m)continue;const factor=m[4]?.toLowerCase()==='mm'?0.1:1;p.keys.forEach((k,i)=>{if(found[k]===undefined)found[k]=String(Number((Number(m[i+1])*factor).toFixed(4)))});}
 for(const [key,names] of Object.entries(textual)){
   for(const alias of names){const re=new RegExp('(?:^|\\n)\\s*'+escaped(alias).replace(/\\ /g,'\\s*')+'\\s*[:=]\\s*([^\\n;]+)','im');const m=text.match(re);if(m){const v=m[1].trim();if(v){found[key]=key==='model'?v.split(/\s+/)[0]:v;break;}}}
 }
 if(!found.model){for(const line of text.split(/\n/)){const v=line.trim();if(/^[A-Za-z]{1,8}[-_]?[A-Za-z0-9]{2,}(?:[-_][A-Za-z0-9]+)*$/.test(v)){found.model=v;break;}}}
 const c=text.match(/(?:产品分类|分类)\s*[:=]\s*(休闲椅|沙发床|沙发|摇椅|脚蹬|其他)/);if(c)found.category=c[1];
 const currency=text.match(/(?:币种|currency)\s*[:=]\s*(CNY|RMB|USD)/i);if(currency)found.currency=currency[1].toUpperCase()==='RMB'?'CNY':currency[1].toUpperCase();
 return found;
}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
function handleImage(file){
 if(!file||!file.type.startsWith('image/'))return;
 if(file.size>5*1024*1024){alert('图片不能超过 5MB，请先压缩。');return;}
 const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{
   const canvas=document.createElement('canvas');const scale=Math.min(1,1000/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   selectedPhoto=canvas.toDataURL('image/jpeg',0.75);$('smartImagePreview').src=selectedPhoto;$('smartImagePreview').style.display='block';$('smartImageMessage').textContent='已关联白底图（待填入表单）';
 };img.onerror=()=>alert('无法读取图片');img.src=reader.result;};reader.readAsDataURL(file);
}
$('smartImage').addEventListener('change',e=>handleImage(e.target.files[0]));
$('specText').addEventListener('paste',e=>{const files=Array.from(e.clipboardData?.items||[]).filter(x=>x.kind==='file'&&x.type.startsWith('image/'));if(files.length){e.preventDefault();handleImage(files[0].getAsFile());}});
$('parseSpecs').onclick=()=>{parsed=extract($('specText').value);const entries=Object.entries(parsed);$('applySpecs').disabled=!entries.length&&!selectedPhoto;$('specPreview').hidden=!entries.length;$('specPreview').innerHTML=entries.length?'<table><thead><tr><th>分类字段</th><th>识别值</th></tr></thead><tbody>'+entries.map(([k,v])=>'<tr><td>'+escapeHtml(labels[k]||k)+'</td><td>'+escapeHtml(v)+'</td></tr>').join('')+'</tbody></table>':'';$('specMessage').textContent=entries.length?`识别到 ${entries.length} 项参数${selectedPhoto?'，并已选择产品主图':''}。核对无误后点击“填入产品表单”。`:(selectedPhoto?'已关联产品图，未识别到文字参数。':'没有识别到参数，请使用“总宽65 总深66”等带字段名称的文字。');};
$('applySpecs').onclick=()=>{let n=0;for(const [key,value] of Object.entries(parsed)){const el=$('form').elements[key];if(el){el.value=value;n++;}}if(selectedPhoto){image=selectedPhoto;$('photo').value='';}$('form').scrollIntoView({behavior:'smooth',block:'start'});$('status').textContent=`已填写 ${n} 项${selectedPhoto?'并关联主图':''}，请检查后点击“保存产品”。`;};
$('exampleSpecs').onclick=()=>{$('specText').value='PD00516\n总深66 座深48 坐高44\n总宽65 总高75\n毛重10.2kg 净重7.35kg';$('parseSpecs').click();};
$('clearSpecs').onclick=()=>{$('specText').value='';$('smartImage').value='';$('smartImagePreview').removeAttribute('src');$('smartImagePreview').style.display='none';$('smartImageMessage').textContent='尚未选择图片';selectedPhoto='';parsed={};$('applySpecs').disabled=true;$('specPreview').hidden=true;$('specPreview').innerHTML='';$('specMessage').textContent='';};
})();
</script></body></html>
